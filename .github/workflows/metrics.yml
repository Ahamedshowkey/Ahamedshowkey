name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic

          # ---------- Base sections ----------
          base: header, activity, community, repositories

          # ---------- Appearance ----------
          config_timezone: Asia/Colombo
          config_display: large
          config_theme: github_dark
          config_order: base.header, isocalendar, languages, achievements, habits, stars, topics, followup, lines, base.activity+community, base.repositories

          # ---------- Languages ----------
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15

          # ---------- Achievements ----------
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

          # ---------- Isometric contribution calendar ----------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ---------- Coding habits ----------
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # ---------- Starred topics / stars ----------
          plugin_stars: yes
          plugin_stars_limit: 4

          # ---------- Topics you contribute to ----------
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars

          # ---------- Follow-up (issues/PRs you opened) ----------
          plugin_followup: yes
          plugin_followup_sections: repositories, user

          # ---------- Lines of code ----------
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base, repositories
