name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          
          # MAGIC SETTING: Prevents one broken plugin from ruining the card
          plugins_errors_fatal: no

          # ---------- Appearance ----------
          config_timezone: Asia/Colombo
          config_display: large
          config_output: svg

          # ---------- Base sections ----------
          base: header, activity, community, repositories, metadata
          
          # ---------- Lines of code ----------
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base, repositories
          
          # ---------- Follow-up (Issues/PRs) ----------
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          
          # ---------- Languages (The percentage bar) ----------
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          
          # ---------- Isometric Commit Calendar (The 3D green blocks) ----------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # ---------- Contributions Calendar (The 2D grid) ----------
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          # ---------- Starred Topics & Repositories ----------
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars
          
          plugin_stars: yes
          plugin_stars_limit: 4
          
          # ---------- Star History (The line charts) ----------
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          
          # ---------- Followers / Following ----------
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

          # ---------- Reactions (The emojis at the bottom) ----------
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_days: 14
          plugin_reactions_details: percentage
