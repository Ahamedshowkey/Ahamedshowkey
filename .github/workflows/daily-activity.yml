name: Daily Activity Log

on:
  schedule:
    # 09:00 Sri Lanka time (03:30 UTC) every day
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add 1-4 random entries
        env:
          GH_TOKEN: ${{ github.token }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          # Commits only count on your calendar if the email is linked to your account.
          # The GitHub noreply email is always linked.
          USER_ID=$(gh api "users/${USER_NAME}" --jq .id)
          git config user.name "$USER_NAME"
          git config user.email "${USER_ID}+${USER_NAME}@users.noreply.github.com"

          COUNT=$(( (RANDOM % 4) + 1 ))
          for i in $(seq 1 "$COUNT"); do
            echo "$(date -u +'%Y-%m-%d %H:%M:%S') UTC - entry $i" >> activity-log.md
            git add activity-log.md
            git commit -m "docs: daily log entry $i [skip ci]"
          done

          git push
